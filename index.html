<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Singapore undergraduate programmes with curated official-source admission deadlines and clearly marked data gaps.">
  <title>Admissions Atlas · Singapore 2027 preview</title>
  <link rel="stylesheet" href="styles.css">
  <script type="module" src="src/static-app.js"></script>
</head>
<body>
  <a class="skip-link" href="#workspace">Skip to universities</a>
  <header class="topbar"><div class="brand"><span class="brand-mark" aria-hidden="true">a.</span><span>Admissions <strong>Atlas</strong></span></div><span class="edition">Undergraduate admissions · 2027</span></header>
  <main class="page">
    <details class="filter-panel"><summary><span>Destinations & subjects</span><span id="filter-summary" class="filter-summary">Singapore · Economics, Criminology</span></summary><div class="filter-heading"><button type="button" id="reset-filters" class="text-button">Reset filters</button></div><div id="filters" class="filter-grid"></div><p id="filter-note" class="filter-note" role="status">Curated catalogue · added options need programme data.</p></details>
    <p id="loading" role="status">Loading the catalogue…</p>
    <div id="workspace" class="workspace" tabindex="-1"></div>
    <p id="announcer" class="sr-only" role="status" aria-live="polite"></p>
    <noscript><p>This static dashboard needs JavaScript to display its generated JSON catalogue.</p></noscript>
  </main>
  <footer class="page footer">Curated data · official sources in details · fictional examples labelled</footer>
</body>
</html>
