summary: Indian Standard XII application and document conditions have been captured. Minimum subject requirements vary by programme and must still be checked on the official programme page.
requirements:
  - label: India Standard XII documents
    status: extracted
    text: Provide Standard X and XII results. Applicants taking the 2027 examinations can apply while awaiting final results, then upload actual results within three days of official release. CBSE candidates must include their admit card with that upload. Decisions require actual results.
    sourceIds: [india-xii]
  - label: Application form and English conditions
    status: extracted
    text: The qualification selects the India Standard XII application. Singapore citizens/PRs and international applicants use their corresponding forms. English-test evidence can be required when English was not the teaching medium or was studied as a second language.
    sourceIds: [india-xii]
  - label: Mathematics and programme-specific prerequisites
    status: extracted
    text: For programmes requiring senior-high mathematics, NTU states that Standard XII Business Mathematics and Applied Mathematics do not satisfy that prerequisite. The full subject requirements for each programme have not been extracted here.
    sourceIds: [india-xii]
