requirements:
  - label: Programme instructions and language
    status: extracted
    text: "Economics and Business Economics: English-taught; diploma equivalence, mathematics and
      language requirements must be assessed by the university. Current offering verified. Admission
      eligibility and optional combinations are not guaranteed. The September 2027 admissions
      calendar is verified separately. Econometrics and Data Science: English-taught; diploma
      equivalence, mathematics and language requirements must be assessed by the university.
      Quantitative economics with mathematical, data or computing methods; this is not a general
      computer-science degree. Current offering verified. Admission eligibility and optional
      combinations are not guaranteed. The September 2027 admissions calendar is verified
      separately. BSc Criminologie — Dutch-taught: Dutch-taught; Dutch proficiency and
      foreign-diploma assessment are required. Current offering verified. Admission eligibility and
      optional combinations are not guaranteed."
    sourceIds:
      - economics-admissions
      - econometrics-admissions
      - criminology-admissions
  - label: Indian school-board equivalence and individual eligibility
    status: not-extracted
    text: No automatic CBSE, ISC, IB, Cambridge or Indian state-board equivalence is asserted. The
      university must assess the final qualification, subjects and language evidence. Nationality
      alone is insufficient.
    sourceIds: []
