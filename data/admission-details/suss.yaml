requirements:
  - label: International education and tests
    status: extracted
    text: International-qualification applicants need at least 12 years of completed formal education and an accepted test. Published examples include SAT 1260 with 630 each for Reading/Math, ACT 28 with Writing 8, IELTS Academic 6.5 and PTE Academic 58. Other alternatives and validity periods are listed on the page. Scores must be submitted by 31 March in the admission year.
    sourceIds: [criteria-page]
