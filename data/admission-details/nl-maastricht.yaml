    text: "BSc Economics and Business Economics: English-taught; diploma equivalence, mathematics and
      language requirements must be assessed by the university. Current offering verified. Admission
      eligibility and optional combinations are not guaranteed. BSc Econometrics & Operations
      Research: English-taught; diploma equivalence, mathematics and language requirements must be
      assessed by the university. Quantitative economics with mathematical, data or computing
      methods; this is not a general computer-science degree. Current offering verified. Admission
      eligibility and optional combinations are not guaranteed."
